name: NS Train Alert

on:
  schedule:
    # 6:00 UTC = 7:00 CET (winter) / 8:00 CEST (summer) — script handles DST
    - cron: '0 5 * * 1-5'
    # 6:30 UTC
    - cron: '30 5 * * 1-5'
  workflow_dispatch:

jobs:
  check-trains:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Check trains
        env:
          NS_API_KEY: ${{ secrets.NS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python .github/scripts/check_trains.py
